name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 与产物运行时同 patch（package.json cryoclaw.node）：避免测试跑在
          # 与发行版不同的 Node 补丁级上导致行为漂移（b559a51 把运行时升到
          # 24.21.0 时漏改这里，CI 一直跑在 22 上——Node 24 Windows fs.rmSync
          # 静默失败等发行链路问题在 CI 复现不了）
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 42+ 不再在 postinstall 下载二进制（首次 import 时才懒下载）；
      # 主进程 vitest 会 import electron，需显式预置二进制（GitHub runner 可直连官方源）
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # chat-ui 是独立 npm 工程（test:chat 的 typecheck/单测依赖其 node_modules）；
      # 用 npm ci 按 lockfile 安装，避免依赖漂移（与根工程一致）
      - name: Install chat-ui dependencies
        run: npm --prefix chat-ui/ui ci

      # 全量回归：vitest（主进程）+ node:test（编译产物）+ chat-ui typecheck 与单测
      - name: Unit tests
        run: npm run test:unit

      # 打包/升级链路脚本用例（不需要内核下载，纯逻辑验证）；
      # package-resources.test.js 会在 vm 里真实执行打包逻辑，与其它用例并行会争抢
      # 临时文件（Unable to deserialize cloned data），故拆分单独串行运行。
      # 除该文件外的清单由 glob 动态生成——写死清单曾在删除测试文件后静默漏跑/引用
      # 不存在的文件（R66 修复）。
      - name: Script tests
        shell: bash
        run: |
          node --test $(ls scripts/*.test.js | grep -v '/package-resources\.test\.js$')
          node --test scripts/package-resources.test.js
