<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryoClaw - Error</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #e6ebff;
    }
    .card {
      width: min(680px, calc(100vw - 40px));
      border-radius: 14px;
      background: #111938;
      border: 1px solid #2a366f;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      padding: 22px 20px;
    }
    h1 { margin: 0 0 10px; font-size: 20px; }
    p { margin: 0 0 10px; line-height: 1.5; color: #c8d2ff; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: #0ea5e9;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Chat UI not available</h1>
    <p>CryoClaw Chat UI 未能加载。请尝试重新启动应用。</p>
    <button id="retryBtn" type="button">Retry</button>
  </main>
  <script>
    // 本页运行在 file:// origin 下（主进程 loadURL 加载 assets/error.html，
    // 原始 Chat UI entry URL 由主进程经 encodeURIComponent 写入 location.hash）。
    // 之所以不用 data: URL 错误页：data:/http: 页面内 JS 导航 file:// 会被 Chromium
    // 安全策略拒绝（"Not allowed to load local resource"），Retry 将永远无效；
    // file→file 导航不受限。仅接受 file: 协议，防止 hash 被篡改后跳向任意页面。
    (function () {
      var raw = location.hash.startsWith("#") ? location.hash.slice(1) : "";
      var retryUrl = "";
      try { retryUrl = decodeURIComponent(raw); } catch (e) { retryUrl = ""; }
      var parsed = null;
      try { parsed = new URL(retryUrl); } catch (e) { parsed = null; }
      var btn = document.getElementById("retryBtn");
      if (btn && parsed && parsed.protocol === "file:") {
        btn.addEventListener("click", function () {
          window.location.replace(parsed.href);
        });
      }
    })();
  </script>
</body>
</html>
