<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{font:15px/1.55 MiSans,Inter,'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;color:#101317;padding:22px;overflow:auto}h1,h2,h3,p{margin:0}h2{font-size:28px;letter-spacing:-1px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:24px;padding:10px 18px;background:#91d8ff;color:#073952}button:disabled{opacity:.5;cursor:wait}input{border:1px solid #dce3e8;border-radius:14px;padding:10px;min-width:0}.muted{color:#5d6f7a;font:12px/1.6 monospace}.foot{margin-top:16px}.error{color:#cf5c48;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.ink{background:linear-gradient(140deg,#1c2a34,#050708);color:#f8fbff}.ice{background:#96d8fc;color:#082f46}a{color:inherit}.section{display:flex;align-items:center;justify-content:space-between;padding:36px 42px}.section h1{font-size:clamp(26px,4vw,46px);line-height:1.2;letter-spacing:-1.5px;white-space:pre-line}.art{white-space:pre;font:clamp(10px,2vw,20px)/1.1 monospace;letter-spacing:5px;opacity:.7}.pill{padding:5px 13px;border-radius:20px;background:#ffffff30}.line{border-top:1px solid #8883;margin:18px 0}#status{margin-top:10px}svg{width:100%;height:42px;display:block}button:focus-visible,input:focus-visible{outline:3px solid #168aff;outline-offset:3px}body{background:#05090c;color:white}video{margin-top:16px;width:100%;height:245px;border-radius:15px;background:#0e1c25;object-fit:contain}</style><style>
