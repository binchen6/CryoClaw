<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{font:15px/1.55 MiSans,Inter,'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;color:#101317;padding:22px;overflow:auto}h1,h2,h3,p{margin:0}h2{font-size:28px;letter-spacing:-1px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:24px;padding:10px 18px;background:#91d8ff;color:#073952}button:disabled{opacity:.5;cursor:wait}input{border:1px solid #dce3e8;border-radius:14px;padding:10px;min-width:0}.muted{color:#85939c;font:12px/1.6 monospace}.foot{margin-top:16px}.error{color:#cf5c48;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.ink{background:linear-gradient(140deg,#1c2a34,#050708);color:#f8fbff}.ice{background:#96d8fc;color:#082f46}a{color:inherit}.section{display:flex;align-items:center;justify-content:space-between;padding:36px 42px}.section h1{font-size:clamp(26px,4vw,46px);line-height:1.2;letter-spacing:-1.5px;white-space:pre-line}.art{white-space:pre;font:clamp(10px,2vw,20px)/1.1 monospace;letter-spacing:5px;opacity:.7}.pill{padding:5px 13px;border-radius:20px;background:#ffffff30}.line{border-top:1px solid #8883;margin:18px 0}#status{margin-top:10px}svg{width:100%;height:42px;display:block}button:focus-visible,input:focus-visible{outline:3px solid #168aff;outline-offset:3px}.stock{padding:23px 0;border-bottom:1px solid #dce3e8}.stock>div:last-child{font-weight:750;font-size:20px}body{background:linear-gradient(130deg,#fff,#edf2f6)}</style></head><body><h2>A 股盯盘</h2><div id="stocks" class="foot"></div><p id="stamp" class="muted foot">东方财富公开行情 · 有效数据到达后展示</p><p id="status" class="error"></p><style>.stock svg{width:110px;height:34px;margin-left:auto;flex-shrink:0}.stock>div:last-child{font-size:18px;min-width:148px;text-align:right}@media(max-width:470px){.stock svg{display:none}.stock>div:last-child{min-width:0}}</style><script>function spark(values,color){const v=values.filter(Number.isFinite);if(v.length<2)return null;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),line=document.createElementNS(svg.namespaceURI,'polyline'),min=Math.min(...v),range=Math.max(...v)-min||1;svg.setAttribute('viewBox','0 0 120 34');svg.setAttribute('aria-label','最近每日走势');line.setAttribute('points',v.map((x,i)=>(i*120/(v.length-1))+','+(30-(x-min)*26/range)).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke',color);line.setAttribute('stroke-width','2');svg.append(line);return svg;}async function drawStockCharts(){for(const [i,id]of ['600519','300750','002594'].entries())try{const r=await cryoclawDashboard.data('k'+id),row=document.querySelectorAll('.stock')[i];if(!row)continue;row.querySelector('svg')?.remove();const chart=spark((r.value?.data?.klines??[]).map(v=>Number(v.split(',')[2])),'#168aff');if(chart)row.insertBefore(chart,row.lastChild);}catch{}}async function refresh(){try{const r=await cryoclawDashboard.data('stocks');if(!Array.isArray(r.value?.data?.diff)||!r.value.data.diff.length)throw Error('行情暂无数据');document.getElementById('stocks').replaceChildren(...r.value.data.diff.map(s=>{const row=document.createElement('div');row.className='stock row';const name=document.createElement('div'),price=document.createElement('div'),title=document.createElement('b'),code=document.createElement('p');title.textContent=s.f14;code.className='muted';code.textContent=s.f12;name.append(title,code);price.textContent=(typeof s.f2==='number'?'¥'+s.f2.toFixed(2):'—')+'　'+(typeof s.f3==='number'?s.f3.toFixed(2)+'%':'—');price.style.color=Number(s.f3)>=0?'#0789ee':'#69737c';row.append(name,price);return row;}));const stamp=Math.max(...r.value.data.diff.map(s=>Number(s.f124)||0));document.getElementById('stamp').textContent='东方财富 · 源时间 '+(stamp?new Date(stamp*1000).toLocaleString():'未提供')+' · 每分钟检查';document.getElementById('status').textContent='';void drawStockCharts();}catch(e){document.getElementById('status').textContent='行情暂不可用：'+e.message;}}refresh();setInterval(refresh,60000);</script></body></html>
