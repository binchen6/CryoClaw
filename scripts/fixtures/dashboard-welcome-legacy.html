<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:MiSans,Inter,'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;color:#101317;padding:26px 30px}h1,h2,p{margin:0}h2{font-size:30px;letter-spacing:-1px}p{line-height:1.65}.caption{font-size:14px;color:#69727a}.stamp{position:absolute;bottom:24px;left:30px;font:12px monospace;letter-spacing:3px;color:#688b9b}.art{position:absolute;right:4%;top:12%;font:16px/1.25 monospace;letter-spacing:4px;white-space:pre;pointer-events:none;color:#168aff;opacity:.6}</style><style>body{display:flex;align-items:center;padding:26px 42px}h1{font-size:clamp(34px,5.5vw,64px);font-weight:850;line-height:1.12;letter-spacing:-3px;z-index:1}h1 em{font-style:normal;color:#168aff}.art{font-size:clamp(8px,1.3vw,18px);color:#007bdb;right:4%;top:8%;opacity:.85}.caption{position:absolute;bottom:26px;left:42px;font-size:17px;color:#8a989d}@media(max-width:650px){.art{right:-20%;opacity:.24}.caption{font-size:13px}}</style><style>

</style><style>
 body{position:relative;background:radial-gradient(ellipse at 78% 40%,#d9f2ff 0,transparent 48%),linear-gradient(115deg,#fff,#f8fcff)!important}
 .eyebrow{position:absolute;left:44px;top:24px;font:11px/1.4 monospace;letter-spacing:2.5px;color:#7b98a8}
 h1{font-size:72px!important;line-height:1.02!important;letter-spacing:-5px!important;margin-top:2px!important}h1 em{position:relative}h1 em:after{content:'';position:absolute;left:-3px;right:-3px;bottom:4px;height:8px;background:#168aff18;z-index:-1}
 .caption{bottom:25px!important;font-size:14px!important;color:#78909c!important;letter-spacing:.5px!important}.caption:first-letter{color:#168aff}
 .welcome-actions{position:absolute;left:44px;bottom:53px;display:flex;gap:10px;z-index:3}.welcome-actions button{padding:10px 18px;border-radius:99px;font-size:13px;background:#101c24;color:white;box-shadow:0 7px 18px #102a3a1c}.welcome-actions button+button{background:#ffffffa8;color:#305064;box-shadow:inset 0 0 0 1px #d8e7ef}.welcome-actions span{margin-left:12px;color:#91d8ff}
 .art{right:5%!important;top:15%!important;font-size:19px!important;line-height:1.25!important;letter-spacing:5px!important;opacity:.62!important;filter:drop-shadow(0 8px 12px #168aff12)}
 @media(max-width:700px){h1{font-size:54px!important}.art{right:-8%!important;opacity:.25!important}.eyebrow{left:32px}.welcome-actions{left:32px}.caption{left:32px!important}}
 </style></head><body><p class="eyebrow">CRYOCLAW / LIVING DASHBOARDS</p><h1>一块<br><em>活</em>的看板</h1><div class="welcome-actions"><button id="create">开始设计 <span>↗</span></button><button id="tour">探索示例</button></div><canvas class="cryo-field" aria-hidden="true"></canvas><p class="caption">⬡ 独立工作 · 任何事情 · 自由排版</p><script>(()=>{
const canvas=document.querySelector('.cryo-field'),sdk=window.cryoclawDashboard;if(!canvas||!sdk?.motion)return;
const ctx=canvas.getContext('2d');if(!ctx)return;
const dark=!!document.querySelector('.ink'),nodes=Array.from({length:32},(_,i)=>({x:(i%8)/7,y:Math.floor(i/8)/3,phase:i*.83,radius:1.8+(i%4)*.55}));
function draw(time){
 const dpr=Math.min(devicePixelRatio||1,2),width=Math.max(1,Math.round(canvas.clientWidth*dpr)),height=Math.max(1,Math.round(canvas.clientHeight*dpr));
 if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
 const w=width/dpr,h=height/dpr,t=sdk.motion.reduced?0:time/5200;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const placed=nodes.map(n=>({x:w*(.08+n.x*.84)+Math.sin(t+n.phase)*w*.012,y:h*(.12+n.y*.76)+Math.cos(t*.8+n.phase)*h*.018,radius:n.radius}));
 const limit=Math.min(w,h)*.4;
 for(let i=0;i<placed.length;i++)for(let j=i+1;j<placed.length;j++){
  const a=placed[i],b=placed[j],distance=Math.hypot(a.x-b.x,a.y-b.y);if(distance>=limit)continue;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=dark?'rgba(157,220,255,'+(1-distance/limit)*.58+')':'rgba(22,138,255,'+(1-distance/limit)*.48+')';ctx.lineWidth=.85;ctx.stroke();
 }
 for(const [i,p] of placed.entries()){
  ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fillStyle=dark?'rgba(197,235,255,.82)':'rgba(22,138,255,.72)';ctx.fill();
  if(i%7)continue;const radius=9+Math.sin(t+i)*1.6;ctx.beginPath();
  for(let k=0;k<6;k++){const angle=Math.PI/3*k-Math.PI/6,x=p.x+Math.cos(angle)*radius,y=p.y+Math.sin(angle)*radius;k?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.closePath();ctx.strokeStyle=dark?'rgba(211,241,255,.64)':'rgba(22,138,255,.55)';ctx.lineWidth=1.15;ctx.stroke();
 }
}
sdk.motion.frame(draw,{fps:24});
})();</script><script>document.getElementById('create').onclick=()=>cryoclawDashboard.compose('为我设计一块有实际用途的看板。先了解我的目标，再创建模块。');document.getElementById('tour').onclick=()=>cryoclawDashboard.expand();</script></body></html>
